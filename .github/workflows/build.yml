name: build-test
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in Arch container
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work archlinux:latest bash -c '
            pacman -Syu --noconfirm base-devel sudo
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
            chown -R builder /work
            su builder -c "makepkg -s --noconfirm"
          '
      - name: Checksum
        run: sha256sum *.pkg.tar.zst > sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            *.pkg.tar.zst
            sha256sums.txt
          retention-days: 30
